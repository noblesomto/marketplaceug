openapi: 3.0.3
info:
  title: 'Marketplace Nigeria API Documentation'
  description: 'Complete API documentation for Marketplace Nigeria platform'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8030'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: null
security:
  -
    default: []
paths:
  /api/test:
    get:
      summary: ''
      operationId: getApiTest
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 'API is working!'
                properties:
                  status:
                    type: string
                    example: 'API is working!'
      tags:
        - Endpoints
  /api/register:
    post:
      summary: "Register\nPOST /api/register"
      operationId: registerPOSTapiregister
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acc_type:
                  type: string
                  description: ''
                  example: qui
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: zesbjfuqa
                phone:
                  type: string
                  description: ''
                  example: quo
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: major59@example.net
                password:
                  type: string
                  description: 'Must be at least 6 characters.'
                  example: 'fKXL\5h{}''f.'
              required:
                - acc_type
                - name
                - phone
                - email
                - password
  /api/login:
    post:
      summary: "API Login - Step 1: Validate credentials\nPOST /api/login"
      operationId: aPILoginStep1ValidateCredentialsPOSTapilogin
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: olueilwitz@example.com
                password:
                  type: string
                  description: 'Must be at least 4 characters.'
                  example: '`/bSJp0Y$Vc6b'
              required:
                - email
                - password
  /api/verify-otp:
    post:
      summary: "API Login - Step 2: Verify OTP\nPOST /api/verify-otp"
      operationId: aPILoginStep2VerifyOTPPOSTapiverifyOtp
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: cole.isai@example.com
                otp:
                  type: string
                  description: 'Must be 6 digits.'
                  example: '217734'
                trust_device:
                  type: boolean
                  description: ''
                  example: true
              required:
                - email
                - otp
  /api/resend-otp:
    post:
      summary: "Resend OTP\nPOST /api/resend-otp"
      operationId: resendOTPPOSTapiresendOtp
      description: ''
      parameters: []
      responses: {  }
