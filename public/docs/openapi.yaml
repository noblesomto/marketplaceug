      operationId: verifyAccountGETapiverifyemailtoken
      description: ''
      parameters: []
      responses:
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Invalid verification link.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid verification link.'
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: email
        description: ''
        example: ojacobi@example.net
        required: true
        schema:
          type: string
      -
        in: path
        name: token
        description: ''
        example: maiores
        required: true
        schema:
          type: string
