openapi: 3.0.3
info:
  title: 'Marketplace Nigeria API Documentation'
  description: 'Complete REST API documentation for Marketplace Nigeria platform. This API allows you to manage adverts, users, messages, payments, and more.'
  version: '3.0'
servers:
  -
    url: 'http://127.0.0.1:8030'
tags:
  -
    name: Authentication
    description: ''
  -
    name: Adverts
    description: "\nPublic APIs for viewing and browsing adverts"
  -
    name: 'Advert Management'
    description: "\nAPIs for creating, updating, and managing user adverts"
  -
    name: 'Advert Statistics'
    description: "\nAPIs for retrieving advertisement statistics, counts, and filtering"
  -
    name: Search
    description: "\nAPIs for searching and filtering adverts across the platform"
  -
    name: User
    description: "\nAPIs for user dashboard, ads, wishlist, payments, and user interactions"
  -
    name: 'User Profile'
    description: "\nAPIs for managing user profile, settings, verification, and account preferences"
  -
    name: 'User Statistics'
    description: "\nAPIs for retrieving user statistics, feedback, and notifications"
  -
    name: Users
    description: "\nAPIs for blocking and unblocking users"
  -
    name: Messages
    description: "\nAPIs for managing messages and conversations between users"
  -
    name: Notifications
    description: ''
  -
    name: Payments
    description: "\nAPIs for payment processing, Paystack integration, and boost purchases"
  -
    name: Boosts
    description: "\nAPIs for managing advert boosts and boost packages"
  -
    name: Locations
    description: "\nAPIs for locations, states, cities, and shipping calculations"
  -
    name: Testing
    description: ''
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can obtain your authentication token by logging in through the `/api/login` endpoint. The token should be included in the Authorization header as a Bearer token for all authenticated requests.'
security:
  -
    default: []
paths:
  /api/register:
    post:
      summary: 'Register New User'
      operationId: registerNewUser
      description: "Creates a new user account and sends a verification email. The account must be verified\nvia email before the user can log in. Supports both Private and Business account types."
      parameters: []
      responses:
        201:
          description: 'Registration successful'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'Registration successful. Check your email to verify your account.'
                  data:
                    email: john@example.com
                    requires_verification: true
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Registration successful. Check your email to verify your account.'
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: john@example.com
                      requires_verification:
                        type: boolean
                        example: true
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email has already been taken.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The email has already been taken.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
        500:
          description: 'Registration failed'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Registration failed. Please try again.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Registration failed. Please try again.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acc_type:
                  type: string
                  description: ''
                  example: sed
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: qrdsxti
                phone:
                  type: string
                  description: ''
                  example: corporis
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: fisher.isabel@example.net
                password:
                  type: string
                  description: 'Must be at least 6 characters.'
                  example: '_?ScMo3Joqp7lL<'
              required:
                - acc_type
                - name
                - phone
                - email
                - password
      security: []
  /api/login:
    post:
      summary: 'Login (Step 1)'
      operationId: loginStep1
      description: "Authenticates user credentials and initiates the login process. If the device is trusted,\ncompletes login immediately. Otherwise, sends a 6-digit OTP to the user's email for verification."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Trusted device - login successful'
                    type: object
                    example:
                      status: true
                      message: 'Login successful.'
                      data:
                        user:
                          id: 1
                          name: 'John Doe'
                          email: john@example.com
                          acc_type: Private
                          phone: '08012345678'
                        token: 1|abcdefghijklmnopqrstuvwxyz1234567890
                    properties:
                      status:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: 'Login successful.'
                      data:
                        type: object
                        properties:
                          user:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              name:
                                type: string
                                example: 'John Doe'
                              email:
                                type: string
                                example: john@example.com
                              acc_type:
                                type: string
                                example: Private
                              phone:
                                type: string
                                example: '08012345678'
                          token:
                            type: string
                            example: 1|abcdefghijklmnopqrstuvwxyz1234567890
                  -
                    description: 'OTP required'
                    type: object
                    example:
                      status: true
                      message: 'OTP sent to your email.'
                      requires_otp: true
                      email: john@example.com
                    properties:
                      status:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: 'OTP sent to your email.'
                      requires_otp:
                        type: boolean
                        example: true
                      email:
                        type: string
                        example: john@example.com
        401:
          description: 'Invalid credentials'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Incorrect password.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Incorrect password.'
        403:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Account disabled'
                    type: object
                    example:
                      status: false
                      message: 'Account has been disabled. Contact admin.'
                    properties:
                      status:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: 'Account has been disabled. Contact admin.'
                  -
                    description: 'Email not verified'
                    type: object
                    example:
                      status: false
                      message: 'Email not verified. Please verify your email.'
                      requires_verification: true
                      email: john@example.com
                    properties:
                      status:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: 'Email not verified. Please verify your email.'
                      requires_verification:
                        type: boolean
                        example: true
                      email:
                        type: string
                        example: john@example.com
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: icie.purdy@example.org
                password:
                  type: string
                  description: 'Must be at least 4 characters.'
                  example: 'C[!2f5Y{b:Fa"W3;'
              required:
                - email
                - password
      security: []
  /api/verify-otp:
    post:
      summary: 'Verify OTP (Step 2)'
      operationId: verifyOTPStep2
      description: "Verifies the 6-digit OTP sent to the user's email and completes the login process.\nOptionally allows the device to be trusted for 90 days to skip OTP verification in future logins."
      parameters: []
      responses:
        200:
          description: 'OTP verified successfully'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'Login successful.'
                  data:
                    user:
                      id: 1
                      name: 'John Doe'
                      email: john@example.com
                      acc_type: Private
                      phone: '08012345678'
                    token: 1|abcdefghijklmnopqrstuvwxyz1234567890
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Login successful.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: john@example.com
                          acc_type:
                            type: string
                            example: Private
                          phone:
                            type: string
                            example: '08012345678'
                      token:
                        type: string
                        example: 1|abcdefghijklmnopqrstuvwxyz1234567890
        401:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Invalid OTP'
                    type: object
                    example:
                      status: false
                      message: 'Invalid OTP. 4 attempt(s) remaining.'
                    properties:
                      status:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: 'Invalid OTP. 4 attempt(s) remaining.'
                  -
                    description: 'OTP expired'
                    type: object
                    example:
                      status: false
                      message: 'OTP has expired. Please request a new one.'
                    properties:
                      status:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: 'OTP has expired. Please request a new one.'
        404:
          description: 'User not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'User not found.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'User not found.'
        429:
          description: 'Too many attempts'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Too many failed attempts. Request a new OTP.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Too many failed attempts. Request a new OTP.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: raphael85@example.com
                otp:
                  type: string
                  description: 'Must be 6 digits.'
                  example: '393881'
                trust_device:
                  type: boolean
                  description: ''
                  example: true
              required:
                - email
                - otp
      security: []
  /api/resend-otp:
    post:
      summary: 'Resend OTP'
      operationId: resendOTP
      description: "Sends a new 6-digit OTP to the user's email address. Limited to 3 requests per hour\nto prevent abuse. Used when the previous OTP has expired or was not received."
      parameters: []
      responses:
        200:
          description: 'OTP sent successfully'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'New OTP sent to your email.'
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'New OTP sent to your email.'
        404:
          description: 'User not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'User not found.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'User not found.'
        429:
          description: 'Rate limit exceeded'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Too many OTP requests. Try again in 1 hour.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Too many OTP requests. Try again in 1 hour.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: hkozey@example.net
              required:
                - email
      security: []
  '/api/verify/{email}/{token}':
    get:
      summary: 'Verify Email Address'
      operationId: verifyEmailAddress
      description: "Verifies a user's email address using the verification link sent during registration.\nOnce verified, the user can proceed to log in to their account."
      parameters: []
      responses:
        200:
          description: 'Verification successful'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'Email verified successfully. You can now login.'
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Email verified successfully. You can now login.'
        400:
          description: 'Invalid verification link'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Invalid verification link.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid verification link.'
      tags:
        - Authentication
      security: []
    parameters:
      -
        in: path
        name: email
        description: ''
        example: odaniel@example.org
        required: true
        schema:
          type: string
      -
        in: path
        name: token
        description: ''
        example: iusto
        required: true
        schema:
          type: string
  /api/resend-verification:
    post:
      summary: 'Resend Verification Email'
      operationId: resendVerificationEmail
      description: "Resends the email verification link to users who have not yet verified their account.\nA new verification token is generated and sent to the registered email address."
      parameters: []
      responses:
        200:
          description: 'Verification email sent'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'Verification email resent successfully.'
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Verification email resent successfully.'
        400:
          description: 'Invalid request'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Invalid or already verified account.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid or already verified account.'
        500:
          description: 'Failed to send email'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Failed to send verification email.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to send verification email.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: mschinner@example.org
              required:
                - email
      security: []
  /api/forgot-password:
    post:
      summary: 'Forgot Password'
      operationId: forgotPassword
      description: "Initiates the password reset process by sending a password reset link to the user's email.\nThe link contains a secure token that can be used to reset the password."
      parameters: []
      responses:
        200:
          description: 'Reset link sent'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'Password reset link sent to your email.'
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Password reset link sent to your email.'
        404:
          description: 'Email not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'This email does not exist.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'This email does not exist.'
        500:
          description: 'Failed to send email'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Could not send password reset email.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Could not send password reset email.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: bernita.friesen@example.org
              required:
                - email
      security: []
  '/api/reset-password/{user_id}/{token}':
    post:
      summary: 'Reset Password'
      operationId: resetPassword
      description: "Resets the user's password using the token received via email. The token is validated\nbefore allowing the password change. After successful reset, the token is invalidated."
      parameters: []
      responses:
        200:
          description: 'Password reset successful'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'Password reset successfully.'
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Password reset successfully.'
        400:
          description: 'Invalid token'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Invalid reset token.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid reset token.'
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The password confirmation does not match.'
                  errors:
                    password:
                      - 'The password confirmation does not match.'
                properties:
                  message:
                    type: string
                    example: 'The password confirmation does not match.'
                  errors:
                    type: object
                    properties:
                      password:
                        type: array
                        example:
                          - 'The password confirmation does not match.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: 'Must be at least 6 characters.'
                  example: 6Wh2k>$`hNLt7(|gKhva
              required:
                - password
      security: []
    parameters:
      -
        in: path
        name: user_id
        description: 'The ID of the user.'
        example: veniam
        required: true
        schema:
          type: string
      -
        in: path
        name: token
        description: ''
        example: praesentium
        required: true
        schema:
          type: string
  /api/auth/social:
    post:
      summary: 'Social Login'
      operationId: socialLogin
      description: "Authenticates users via social providers (Google or Facebook). The mobile app obtains\nan access token from the provider's SDK and sends it to this endpoint for verification.\nIf successful, creates or updates the user account and returns an API token. No OTP required."
      parameters: []
      responses:
        200:
          description: 'Social login successful'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'Social login successful.'
                  data:
                    user:
                      id: 1
                      name: 'John Doe'
                      email: john@example.com
                      acc_type: Private
                      acc_status: 1
                      google_id: '1234567890'
                    token: 1|abcdefghijklmnopqrstuvwxyz1234567890
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Social login successful.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: john@example.com
                          acc_type:
                            type: string
                            example: Private
                          acc_status:
                            type: integer
                            example: 1
                          google_id:
                            type: string
                            example: '1234567890'
                      token:
                        type: string
                        example: 1|abcdefghijklmnopqrstuvwxyz1234567890
        401:
          description: 'Invalid token'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Invalid social login token.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid social login token.'
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The provider field is required.'
                  errors:
                    provider:
                      - 'The provider field is required.'
                properties:
                  message:
                    type: string
                    example: 'The provider field is required.'
                  errors:
                    type: object
                    properties:
                      provider:
                        type: array
                        example:
                          - 'The provider field is required.'
                        items:
                          type: string
        500:
          description: 'Login failed'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Social login failed. Please try again.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Social login failed. Please try again.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  description: ''
                  example: facebook
                  enum:
                    - google
                    - facebook
                access_token:
                  type: string
                  description: ''
                  example: excepturi
                device_name:
                  type: string
                  description: ''
                  example: voluptatem
                  nullable: true
              required:
                - provider
                - access_token
      security: []
  '/api/auth/{provider}/redirect':
    get:
      summary: 'Get Social Login Redirect URL'
      operationId: getSocialLoginRedirectURL
      description: "Generates the OAuth redirect URL for social login via WebView flow. The mobile app\ncan open this URL in a WebView to initiate the social authentication process.\nUse this for apps that cannot use native social SDKs."
      parameters: []
      responses:
        200:
          description: 'Redirect URL generated'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  data:
                    redirect_url: 'https://accounts.google.com/o/oauth2/auth?client_id=...'
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      redirect_url:
                        type: string
                        example: 'https://accounts.google.com/o/oauth2/auth?client_id=...'
        400:
          description: 'Invalid provider'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Invalid provider.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid provider.'
        500:
          description: 'Failed to generate URL'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Failed to generate redirect URL.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to generate redirect URL.'
      tags:
        - Authentication
      security: []
    parameters:
      -
        in: path
        name: provider
        description: ''
        example: quibusdam
        required: true
        schema:
          type: string
  '/api/auth/{provider}/callback':
    get:
      summary: 'Social Login Callback'
      operationId: socialLoginCallback
      description: "Handles the OAuth callback from social providers during WebView flow. After the user\nauthenticates with the provider, they are redirected here. This endpoint verifies the\nauthentication, creates or updates the user, and returns an API token."
      parameters: []
      responses:
        200:
          description: 'Social login successful'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'Social login successful.'
                  data:
                    user:
                      id: 1
                      name: 'John Doe'
                      email: john@example.com
                      acc_type: Private
                      acc_status: 1
                      facebook_id: '9876543210'
                    token: 1|abcdefghijklmnopqrstuvwxyz1234567890
                properties:
                  status:
