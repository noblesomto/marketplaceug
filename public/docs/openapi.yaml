      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  description: ''
                  example: google
                  enum:
                    - google
                    - facebook
                access_token:
                  type: string
                  description: ''
                  example: voluptas
                device_name:
                  type: string
                  description: ''
                  example: ipsum
                  nullable: true
              required:
