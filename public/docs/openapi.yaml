openapi: 3.0.3
info:
  title: 'Marketplace Nigeria API Documentation'
  description: 'Complete REST API documentation for Marketplace Nigeria platform. This API allows you to manage adverts, users, messages, payments, and more.'
  version: '3.0'
servers:
  -
    url: 'http://127.0.0.1:8030'
tags:
  -
    name: 'Advert Statistics'
    description: "\nAPIs for retrieving advertisement statistics, counts, and filtering"
  -
    name: Endpoints
    description: ''
  -
    name: 'User Statistics'
    description: "\nAPIs for retrieving user statistics, feedback, and notifications"
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can obtain your authentication token by logging in through the `/api/login` endpoint. The token should be included in the Authorization header as a Bearer token for all authenticated requests.'
security:
  -
    default: []
paths:
  /api/adverts/count:
    get:
      summary: 'Get adverts count with filters'
      operationId: getAdvertsCountWithFilters
      description: "Returns the total count of active adverts based on various filters.\nAll filters are optional and can be combined."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    total_count: 1500
                    filters_applied:
                      category: '1'
                      state: Lagos
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      total_count:
                        type: integer
                        example: 1500
                      filters_applied:
                        type: object
                        properties:
                          category:
                            type: string
                            example: '1'
                          state:
                            type: string
                            example: Lagos
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Failed to fetch advert count'
                  error: 'Error details'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to fetch advert count'
                  error:
                    type: string
                    example: 'Error details'
      tags:
        - 'Advert Statistics'
  /api/adverts/by-state:
    get:
      summary: 'Get adverts grouped by state'
      operationId: getAdvertsGroupedByState
      description: "Returns the count of active adverts grouped by Nigerian states.\nResults are ordered by state with the most adverts first."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    states:
                      -
                        state: Lagos
                        total: 500
                      -
                        state: Abuja
                        total: 300
                      -
                        state: 'Port Harcourt'
                        total: 250
                    filters_applied:
                      category: '1'
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      states:
                        type: array
                        example:
                          -
                            state: Lagos
                            total: 500
                          -
                            state: Abuja
                            total: 300
                          -
                            state: 'Port Harcourt'
                            total: 250
                        items:
                          type: object
                          properties:
                            state:
                              type: string
                              example: Lagos
                            total:
                              type: integer
                              example: 500
                      filters_applied:
                        type: object
                        properties:
                          category:
                            type: string
                            example: '1'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Failed to fetch adverts by state'
                  error: 'Error details'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to fetch adverts by state'
                  error:
                    type: string
                    example: 'Error details'
      tags:
        - 'Advert Statistics'
  /api/adverts/count-filtered:
    get:
      summary: 'Get advert count filtered by verified sellers'
      operationId: getAdvertCountFilteredByVerifiedSellers
      description: "Returns the count of adverts from verified or unverified sellers.\nUseful for showing marketplace trust metrics."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    count: 250
                    verified: 'yes'
                    category: electronics
                    sub_category: mobile-phones
                    brand: samsung
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 250
                      verified:
                        type: string
                        example: 'yes'
                      category:
                        type: string
                        example: electronics
                      sub_category:
                        type: string
                        example: mobile-phones
                      brand:
                        type: string
                        example: samsung
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Failed to fetch filtered advert count'
                  error: 'Error details'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to fetch filtered advert count'
                  error:
                    type: string
                    example: 'Error details'
      tags:
        - 'Advert Statistics'
  /api/adverts/brands:
    get:
      summary: 'Get brands with advert counts'
      operationId: getBrandsWithAdvertCounts
      description: "Returns a list of brands with their active advert counts.\nCan be filtered by category or sub-category. Only returns brands with at least one active advert."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    brands:
                      -
                        id: 1
                        brand_name: Samsung
                        brand_slug: samsung
                        adverts_count: 45
                        sub_category:
                          id: 5
                          sub_cat_name: 'Mobile Phones'
                          category:
                            id: 1
                            category_name: Electronics
                      -
                        id: 2
                        brand_name: Apple
                        brand_slug: apple
                        adverts_count: 38
                        sub_category:
                          id: 5
                          sub_cat_name: 'Mobile Phones'
                          category:
                            id: 1
                            category_name: Electronics
                    category_id: 1
                    sub_category_id: 5
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      brands:
                        type: array
                        example:
                          -
                            id: 1
                            brand_name: Samsung
                            brand_slug: samsung
                            adverts_count: 45
                            sub_category:
                              id: 5
                              sub_cat_name: 'Mobile Phones'
                              category:
                                id: 1
                                category_name: Electronics
                          -
                            id: 2
                            brand_name: Apple
                            brand_slug: apple
                            adverts_count: 38
                            sub_category:
                              id: 5
                              sub_cat_name: 'Mobile Phones'
                              category:
                                id: 1
                                category_name: Electronics
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            brand_name:
                              type: string
                              example: Samsung
                            brand_slug:
                              type: string
                              example: samsung
                            adverts_count:
                              type: integer
                              example: 45
                            sub_category:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 5
                                sub_cat_name:
                                  type: string
                                  example: 'Mobile Phones'
                                category:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                      example: 1
                                    category_name:
                                      type: string
                                      example: Electronics
                      category_id:
                        type: integer
                        example: 1
                      sub_category_id:
                        type: integer
                        example: 5
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Failed to fetch brands with advert count'
                  error: 'Error details'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to fetch brands with advert count'
                  error:
                    type: string
                    example: 'Error details'
      tags:
        - 'Advert Statistics'
